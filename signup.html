<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — JobMatch</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/auth.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="auth-page">

  <!-- Logo -->
  <a href="../index.html" class="auth-logo">
    <div class="logo-icon">
      <i class="bi bi-briefcase-fill"></i>
    </div>
    Job<span>Match</span>
  </a>

  <div class="auth-card">

    <h1 class="auth-card__title">Get started</h1>
    <p class="auth-card__sub">Create a new account</p>

    <!-- Google -->
    <button class="btn--google" id="googleSignupBtn" onclick="signInWithGoogle()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" width="18" height="18" />
      Continue with Google
    </button>

    <div class="auth-divider"><span>or</span></div>

    <!-- Form -->
    <form id="signupForm" novalidate>

      <div class="field">
        <label class="field__label" for="fullName">Full name</label>
        <div class="field__wrap">
          <i class="bi bi-person field__icon"></i>
          <input class="field__input" type="text" id="fullName" autocomplete="name" required />
        </div>
        <span class="field__error" id="nameError"></span>
      </div>

      <div class="field">
        <label class="field__label" for="username">Username <span style="color:var(--text-faint);font-weight:400">· used in community chat</span></label>
        <div class="field__wrap">
          <i class="bi bi-at field__icon"></i>
          <input class="field__input" type="text" id="username" autocomplete="off" required />
        </div>
        <span class="field__error" id="usernameError"></span>
      </div>

      <div class="field">
        <label class="field__label" for="email">Email address</label>
        <div class="field__wrap">
          <i class="bi bi-envelope field__icon"></i>
          <input class="field__input" type="email" id="email" autocomplete="email" required />
        </div>
        <span class="field__error" id="emailError"></span>
      </div>

      <div class="field">
        <label class="field__label" for="password">Password</label>
        <div class="field__wrap">
          <i class="bi bi-lock field__icon"></i>
          <input class="field__input" type="password" id="password" autocomplete="new-password" required />
          <button type="button" class="field__toggle" onclick="togglePw('password','pwEye')">
            <i class="bi bi-eye" id="pwEye"></i>
          </button>
        </div>
        <span class="field__error" id="passwordError"></span>
        <!-- Password strength checklist -->
        <div class="pw-rules">
          <div class="pw-rule" id="rule-upper"><i class="bi bi-check-circle-fill"></i> Uppercase letter</div>
          <div class="pw-rule" id="rule-lower"><i class="bi bi-check-circle-fill"></i> Lowercase letter</div>
          <div class="pw-rule" id="rule-number"><i class="bi bi-check-circle-fill"></i> A number</div>
          <div class="pw-rule" id="rule-special"><i class="bi bi-check-circle-fill"></i> Special character</div>
          <div class="pw-rule" id="rule-length"><i class="bi bi-check-circle-fill"></i> Min. 8 characters</div>
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="confirmPassword">Confirm password</label>
        <div class="field__wrap">
          <i class="bi bi-lock-fill field__icon"></i>
          <input class="field__input" type="password" id="confirmPassword" autocomplete="new-password" required />
          <button type="button" class="field__toggle" onclick="togglePw('confirmPassword','cpEye')">
            <i class="bi bi-eye" id="cpEye"></i>
          </button>
        </div>
        <span class="field__error" id="confirmError"></span>
      </div>

      <div class="field">
        <span class="field__label-only">I am a…</span>
        <div class="role-picker">
          <label class="role-option">
            <input type="radio" name="role" value="seeker" checked />
            <div class="role-option__card">
              <i class="bi bi-person-badge"></i>
              <span>Job Seeker</span>
            </div>
          </label>
          <label class="role-option">
            <input type="radio" name="role" value="employer" />
            <div class="role-option__card">
              <i class="bi bi-building"></i>
              <span>Employer</span>
            </div>
          </label>
        </div>
      </div>

      <button type="submit" class="btn--submit" id="submitBtn">
        <span id="submitText">Create Account</span>
        <span id="submitSpinner" class="spinner hidden"></span>
      </button>

    </form>

    <p class="auth-card__footer">
      Already have an account? <a href="login.html">Sign in</a>
    </p>

  </div>

  <p class="auth-terms">
    By creating an account you agree to our
    <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
  </p>

  <!-- Toast -->
  <div id="toast" class="toast toast--hidden">
    <span id="toastIcon"></span>
    <span id="toastMsg"></span>
  </div>

  <script src="../js/config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/signup.js"></script>
</body>
</html>
