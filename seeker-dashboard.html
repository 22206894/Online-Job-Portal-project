<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Applications — JobMatch</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/jobs.css" />
  <link rel="stylesheet" href="../css/notifications.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="jobs-page">

  <nav class="navbar">
    <div class="container navbar__inner">
      <a href="../index.html" class="navbar__logo">
        <div class="logo-icon"><i class="bi bi-briefcase-fill"></i></div>
        Job<span>Match</span>
      </a>
      <ul class="navbar__links">
        <li><a href="jobs.html">Browse Jobs</a></li>
        <li><a href="seeker-dashboard.html" class="active">My Applications</a></li>
      </ul>
      <div class="navbar__auth" style="display:flex;align-items:center;gap:10px">
      <div class="notif-wrapper">
        <button class="notif-bell" id="notifBell" onclick="toggleNotifications()" title="Notifications"><i class="bi bi-bell"></i><span class="notif-badge" id="notifBadge" style="display:none">0</span></button>
        <div class="notif-panel" id="notifPanel"><div class="notif-panel__header"><span class="notif-panel__title"><i class="bi bi-bell-fill"></i>Notifications</span><button class="notif-panel__mark-read" onclick="markAllRead()">Mark all read</button></div><div id="notifList"></div></div>
      </div>
        <span class="navbar__user" id="navUser"></span>
        <button class="btn btn--ghost btn--sm" onclick="handleSignOut()">
          <i class="bi bi-box-arrow-right"></i> Sign out
        </button>
      </div>
    </div>
  </nav>

  <div class="dash-header">
    <div class="container">
      <h1 class="dash-header__title">My Dashboard</h1>
      <p class="dash-header__sub" id="dashSub">Loading your applications…</p>
    </div>
  </div>

  <div class="container dash-layout">

    <!-- Stats -->
    <div class="dash-stats">
      <div class="dash-stat">
        <i class="bi bi-send"></i>
        <span class="dash-stat__num" id="dsTotal">—</span>
        <span class="dash-stat__lbl">Applied</span>
      </div>
      <div class="dash-stat">
        <i class="bi bi-eye"></i>
        <span class="dash-stat__num" id="dsReviewed">—</span>
        <span class="dash-stat__lbl">Reviewed</span>
      </div>
      <div class="dash-stat dash-stat--green">
        <i class="bi bi-check-circle"></i>
        <span class="dash-stat__num" id="dsAccepted">—</span>
        <span class="dash-stat__lbl">Accepted</span>
      </div>
      <div class="dash-stat dash-stat--orange">
        <i class="bi bi-graph-up"></i>
        <span class="dash-stat__num" id="dsBestScore">—</span>
        <span class="dash-stat__lbl">Best match</span>
      </div>
    </div>

    <!-- Tabs -->
    <div class="dash-tabs">
      <button class="dash-tab dash-tab--active" onclick="switchTab('applications', this)">
        <i class="bi bi-send"></i> Applications
      </button>
      <button class="dash-tab" onclick="switchTab('saved', this)">
        <i class="bi bi-heart"></i> Saved Jobs
      </button>
      <button class="dash-tab" onclick="switchTab('profile', this)">
        <i class="bi bi-person-badge"></i> My Profile
      </button>
    </div>

    <!-- Applications tab -->
    <div id="tab-applications">
      <div id="appsList">
        <div class="jobs-loading"><div class="spinner-lg"></div><p>Loading…</p></div>
      </div>
    </div>

    <!-- Saved jobs tab -->
    <div id="tab-saved" class="hidden">
      <div id="savedList">
        <div class="jobs-loading"><div class="spinner-lg"></div><p>Loading…</p></div>
      </div>
    </div>

    <!-- Profile tab -->
    <div id="tab-profile" class="hidden">
      <div class="profile-view" id="profileView">
        <div class="jobs-loading"><div class="spinner-lg"></div><p>Loading…</p></div>
      </div>
    </div>

  </div>

  <div id="toast" class="toast toast--hidden">
    <span id="toastIcon"></span><span id="toastMsg"></span>
  </div>

  <script src="../js/config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
